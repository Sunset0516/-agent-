version: '3.8'

services:
  agent-service:
    build: ./agent-service
    container_name: job-agent-service
    ports:
      - "5000:5000"
    environment:
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LLM_MODEL=${LLM_MODEL:-gpt-3.5-turbo}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  backend:
    build: ./backend
    container_name: job-backend
    ports:
      - "3000:3000"
    environment:
      - AGENT_SERVICE_URL=http://agent-service:5000
      - JWT_SECRET=job-agent-secret-key-2026
      - PORT=3000
    volumes:
      - backend-data:/app/data
    depends_on:
      agent-service:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: nginx:alpine
    container_name: job-frontend
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend-data:
